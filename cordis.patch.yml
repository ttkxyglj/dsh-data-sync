# DSH Data Sync — bundle layer.
#
# The patch lists the portable defaults. Everything the Settings page changes is
# written to `$DSH_HOME/dsh-data-sync/config.json` instead, so the UI never has
# to rewrite this file and the profile patch stays readable.
- insert:
    - id: data-sync
      name: '@local/dsh-data-sync'
      config:
        repoUrl: ''
        branch: main
        sources:
          config: true
          memory: true
          skills: true
        keepSnapshots: 10
        autoBackup:
          enabled: false
          intervalHours: 24
        # Keep three days of remote versions and always keep the newest three; older
        # snapshots are pruned from the branch history after a successful push.
        remoteRetention:
          enabled: true
          days: 3
          keepLast: 3
